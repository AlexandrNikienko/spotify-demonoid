<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Spotify Demonoid</title>
    <script src="src/script.ts" type="module"></script>
</head>

<body>
    <h1>Spotify Demonoid</h1>

    <section id="profile">
        <h2>Greetings <span id="displayName"></span></h2>
        <span id="avatar"></span>
        <ul>
            <!-- <li>User ID: <span id="id"></span></li> -->
            <li>Email: <span id="email"></span></li>
            <li>Spotify URI: <a id="uri" href="#"></a></li>
            <!-- <li>Link: <a id="url" href="#"></a></li> -->
            <!-- <li>Profile Image: <span id="imgUrl"></span></li> -->
        </ul>
    </section>

    <section id="player-section" style="margin-top:2rem;">

        <label for="playlist-input">Enter playlist ID if it's private or choose a public one from dropdown below:</label><br>
        <input id="playlist-input" type="text" placeholder="YOUR_PLAYLIST_ID" />
        <button id="add-playlist-btn">Add Playlist</button>
        <br><br>

        <select id="playlist-select">
            <option value="">--Select a playlist--</option>
        </select>
        <button id="load-playlist-btn">Load Playlist</button>
        <br><br>

        <label for="skip-interval-input">Skip tracks every N seconds:</label>
        <input id="skip-interval-input" type="number" placeholder="Skip every N seconds" value="60"/>

        <button id="play-btn">Play</button>
        <button id="stop-btn">Stop</button>

        <button id="logout-btn">Logout</button>
        <hr>
        <iframe
            id="spotify-player"
            src=""
            width="600"
            height="400"
            frameborder="0"
            allowtransparency="true"
            allow="encrypted-media">
        </iframe>
    </section>
</body>

</html>
