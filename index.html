<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Spotify Demonoid</title>
    <script src="src/script.ts" type="module"></script>
</head>

<body>
    <h1>Spotify Demonoid</h1>

    <section id="profile">
        <h2>Greetings <span id="displayName"></span></h2>
        <span id="avatar"></span>
        <ul>
            <!-- <li>User ID: <span id="id"></span></li> -->
            <li>Email: <span id="email"></span></li>
            <li>Spotify URI: <a id="uri" href="#"></a></li>
            <!-- <li>Link: <a id="url" href="#"></a></li> -->
            <!-- <li>Profile Image: <span id="imgUrl"></span></li> -->
        </ul>
    </section>

    <section id="player-section" style="margin-top:2rem;">

        <label for="playlist-input">Enter playlist ID if it's yours and private or any public one, or choose one of your publics from dropdown below:</label><br>
        <input id="playlist-input" type="text" placeholder="YOUR_PLAYLIST_ID" />
        <button id="add-playlist-btn">Add Playlist</button>
        <br><br>

        <select id="playlist-select">
            <option value="">--Select a playlist--</option>
        </select>
        <button id="load-playlist-btn">Load Playlist</button>
        <br><br>

        <label for="skip-interval-input">Skip tracks every N seconds (default is random from 60 to 120 sec):</label>
        <input id="skip-interval-input" type="number" placeholder="Skip every N seconds"/>

        <button id="play-btn">Play</button>
        <button id="stop-btn">Stop</button>

        <button id="logout-btn">Logout</button>

        <hr>
        <div id="now-playing" style="margin-top: 20px; font-size: 16px; font-weight: 500;">
            🎵 Now Playing: <span id="track-title">—</span>
        </div>
        <iframe
            style="background-color: rgb(22, 236, 100);"
            id="spotify-player"
            src=""
            width="600"
            height="400"
            frameborder="0"
            allowtransparency="true"
            allow="encrypted-media">
        </iframe>
    </section>
</body>

</html>
